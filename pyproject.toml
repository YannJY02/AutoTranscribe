[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "insightkit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["numpy", "pytest", "pytest-cov", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["insightkit*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

markers = [
    "unit: fast unit tests with mocks, no external dependencies",
    "integration: tests requiring sidecar process or real models",
    "slow: tests that take more than 5 seconds",
    "requires_model: tests requiring downloaded ASR model files",
]

[tool.coverage.run]
source = ["insightkit", "scripts"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
