name: InsightKitUITestHost
configs:
  Debug: debug
  Release: release
  UITesting: debug
options:
  bundleIdPrefix: com.yannjy
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

targets:
  InsightKitObjCShims:
    type: framework.static
    platform: macOS
    sources:
      - Sources/InsightKitObjCShims
    headers:
      public:
        - Sources/InsightKitObjCShims/include/*.h
    settings:
      base:
        DEFINES_MODULE: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/InsightKitObjCShims/include
        PRODUCT_MODULE_NAME: InsightKitObjCShims
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  InsightKitApp:
    type: application
    platform: macOS
    sources:
      - Sources/InsightKitApp
      - Resources
    dependencies:
      - target: InsightKitObjCShims
        embed: false
    entitlements:
      path: InsightKitApp.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.app-sandbox: false
    info:
      path: InsightKitApp-Info.plist
      properties:
        NSMicrophoneUsageDescription: "InsightKit 需要麦克风权限用于会议录音和实时转写。"
        NSSpeechRecognitionUsageDescription: "InsightKit 需要 Apple Speech 权限用于实验性的本地离线媒体转写。"
        NSScreenCaptureUsageDescription: "InsightKit 需要屏幕录制权限用于系统音频采集与实时洞察。"
        NSCameraUsageDescription: "InsightKit 需要摄像头权限用于视频捕获。"
        CFBundleName: InsightKit
        CFBundleDisplayName: InsightKit
        CFBundleIconFile: InsightKit.icns
        InsightKitPostHogOwnerPilotHost: "https://us.i.posthog.com"
        InsightKitPostHogOwnerPilotProjectKey: "phc_CVQhfmR9RZoe5vXWNDs5PmFJFMbFwag5gQeYJrXSjkNo"
        InsightKitPostHogOwnerPilotRetentionVerified: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).import
            CFBundleURLSchemes:
              - $(INSIGHTKIT_URL_SCHEME)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannjy.insightkit
        INSIGHTKIT_URL_SCHEME: insightkit
        PRODUCT_NAME: InsightKitApp
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
      configs:
        UITesting:
          PRODUCT_BUNDLE_IDENTIFIER: com.yannjy.insightkit.uitesthost
          INSIGHTKIT_URL_SCHEME: insightkit-uitest

  InsightKitUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
      - Sources/InsightKitApp/Services/UITestStorageContext.swift
    dependencies:
      - target: InsightKitApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yannjy.insightkit.uitests
        SWIFT_VERSION: "5.0"
        # Window-only evidence uses SCShareableContent.currentProcess (macOS 14.4+).
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        TEST_TARGET_NAME: InsightKitApp
        GENERATE_INFOPLIST_FILE: YES

schemes:
  InsightKitApp:
    build:
      targets:
        InsightKitApp: all
        InsightKitUITests: [test]
    run:
      config: Debug
    test:
      config: UITesting
      targets:
        - InsightKitUITests
